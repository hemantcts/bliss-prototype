<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="{{BASE}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#2b2118">
<title>{{NAME}} | Bliss Bath and Kitchen</title>
<meta name="description" content="{{DESC}}">
<link rel="preload" href="fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/bliss.min.css">
<script type="speculationrules">{"prerender":[{"where":{"and":[{"href_matches":"/*"},{"not":{"href_matches":"*checkout*"}},{"not":{"href_matches":"*order-confirmed*"}}]},"eagerness":"moderate"}]}</script>
</head>
<body data-page="category" data-top="{{TOP}}" data-cat="{{SLUG}}" data-kind="{{KIND}}">
<div id="site-header"></div>

<main id="main">
  <!-- Category header: compact so products appear above the fold -->
  <section class="cat-head">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb">{{CRUMBS}}</nav>
      <div class="cat-head-row">
        <div class="cat-head-copy">
          <h1>{{NAME}}</h1>
          <p class="cat-lead">{{INTRO}}</p>
        </div>
        <div class="cat-head-img">{{HERO_IMG}}</div>
      </div>
      {{SUBNAV}}
    </div>
  </section>

  <div class="wrap">
    <section class="shop" id="shop">
      <aside class="filters" id="filters" aria-label="Filters">
        <div class="f-title"><span>Filter by</span><span class="f-title-act"><button type="button" id="clearFilters">Clear all</button><button type="button" class="f-close" id="filterClose" aria-label="Close filters"><i data-icon="close" class="sm"></i></button></span></div>
        <div id="filterGroups"></div>
        <div style="padding-top:14px">
          <div class="opt-label">Sort by</div>
          <select class="select" id="sortSide" aria-label="Sort by">
            <option value="featured">Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="rating">Top Rated</option>
          </select>
        </div>
              <button type="button" class="btn block filter-apply" id="filterApply">Show results</button>
      </aside>

      <div>
        <div class="toolbar col-toolbar" id="colToolbar">
          <div class="tb-left">
            <button class="btn ghost sm filter-open" id="filterOpen" aria-controls="filters"><i data-icon="filter" class="sm"></i> Filters <span class="f-count" id="fCount" hidden></span></button>
            <button type="button" class="btn ghost sm sort-open" id="sortOpen" aria-haspopup="dialog" aria-controls="sortSheet"><i data-icon="down" class="sm"></i> Sort<span class="so-val" id="sortVal"></span></button>
            <span id="count">Showing 12 of 42 products</span>
          </div>
          <div class="tools">
            <label class="tb-sort"><span class="sr">Sort by</span><select id="sortTop" aria-label="Sort by"><option value="featured">Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="rating">Top Rated</option></select></label>
            <div class="view-toggle view-desk" role="group" aria-label="Products per row">
              <button class="view-btn on" data-view="4" aria-label="4 per row" aria-pressed="true"><i data-icon="grid3" class="sm"></i></button>
              <button class="view-btn" data-view="3" aria-label="3 per row" aria-pressed="false"><i data-icon="grid" class="sm"></i></button>
            </div>
            <div class="view-toggle view-mob" role="group" aria-label="Products per row">
              <button class="view-btn" data-mview="1" aria-label="1 product per row" aria-pressed="false"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16"/></svg></button>
              <button class="view-btn on" data-mview="2" aria-label="2 products per row" aria-pressed="true"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="7.5" height="16"/><rect x="13" y="4" width="7.5" height="16"/></svg></button>
            </div>
            <label class="per-page">Show <select id="perPage" aria-label="Products per page"><option>12</option><option>24</option><option>48</option></select> per page</label>
          </div>
        </div>
        <!-- Phones: sort options in a bottom sheet -->
        <div class="sort-sheet" id="sortSheet" hidden>
          <div class="ss-scrim" data-ss-close></div>
          <div class="ss-panel" role="dialog" aria-modal="true" aria-labelledby="ssTitle">
            <div class="ss-head"><b id="ssTitle">Sort by</b><button type="button" class="ss-x" data-ss-close aria-label="Close"><i data-icon="close"></i></button></div>
            <div class="ss-opts" role="radiogroup" aria-labelledby="ssTitle">
              <label><input type="radio" name="ssort" value="featured" checked><span>Featured</span></label>
              <label><input type="radio" name="ssort" value="low"><span>Price: Low to High</span></label>
              <label><input type="radio" name="ssort" value="high"><span>Price: High to Low</span></label>
              <label><input type="radio" name="ssort" value="rating"><span>Top Rated</span></label>
            </div>
          </div>
        </div>
        <div class="chips" id="chips"></div>
        <p class="cat-notice" id="catNotice" hidden></p>
        <div class="p-grid" id="grid"></div>
        <nav class="pager" id="pager" aria-label="Pagination" hidden></nav>
      </div>
    </section>
  </div>

  <div id="trust"></div>

  <!-- Content area (editable in WordPress: category description / ACF field) -->
  <section class="section cat-content">
    <div class="wrap">
      {{CONTENT}}
    </div>
  </section>

  <!-- FAQ (editable per category; output as FAQPage structured data) -->
  <section class="section tight cat-faq">
    <div class="wrap">
      <div class="faq-head"><span class="eyebrow gold">Frequently Asked Questions</span><h2>{{NAME}} FAQ</h2></div>
      <div class="faq">{{FAQ}}</div>
    </div>
  </section>
</main>

<div id="newsletter"></div>
<div id="site-footer"></div>

<script type="application/ld+json">{{SCHEMA}}</script>
<script src="js/app.min.js"></script>
<script src="js/pages/collection.min.js"></script>
</body>
</html>
