    <a class="post-feature reveal" href="blog-post.html?post=${f.slug}">
      <span class="pf-img"><img src="img/${f.img}.webp"${imgSet(f.img, '(max-width: 980px) 100vw, 60vw')} alt="" fetchpriority="high"></span>
      <span class="pf-body"><span class="eyebrow gold">Featured · ${f.cat}</span><b>${f.title}</b><span class="muted">${f.excerpt}</span>
        <span class="post-meta"><time datetime="${f.date}">${fmtDate(f.date)}</time><span>${f.read} min read</span></span>
        <span class="link-arrow">Read Article ${icon('arrow', 'sm')}</span></span>
    </a>`;
  let cat = 'All', q = '';
  function render() {
    const cats = ['All', ...new Set(POSTS.map((p) => p.cat))];
    document.getElementById('catChips').innerHTML = cats.map((c) => `<button type="button" aria-pressed="${c === cat}" data-v="${c}">${c}</button>`).join('');
    const list = POSTS.slice(cat === 'All' && !q ? 1 : 0).filter((p) => (cat === 'All' || p.cat === cat) && (!q || (p.title + p.excerpt).toLowerCase().includes(q.toLowerCase())));
    document.getElementById('posts').innerHTML = list.map(card).join('') || '<div class="empty-state" style="grid-column:1/-1"><h2>No articles found</h2><p>Try another search or category.</p></div>';
    observeReveal(document.getElementById('posts'));
  }
  document.getElementById('catChips').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (b) { cat = b.dataset.v; render(); } });
  document.getElementById('postSearch').addEventListener('input', (e) => { q = e.target.value.trim(); render(); });
  render();
  observeReveal();
</script>
</body>
</html>
